sources:
  - name: snowflake_tables
    database: sample_database_raw
    schema: Trail
    tables:
      - name: NAME
        description: Stores customer information for an each account
        columns:
          - name: ID
            description: Unique ID for each customer
            tests:
              - not_null:
                  config:
                    severity: error
          - name: FIRST_NAME
            description: first name for each customer
            tests:
              - not_null:
                  config:
                    severity: error
          - name: LAST_NAME
            description: last name for each customer
            tests:
              - not_null:
                  config:
                    severity: error
          